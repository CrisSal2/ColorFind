<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ColorFind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 300px;
    min-height: 340px;
    background: #0f0f1a;
    color: #e2e8f0;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    padding: 24px 20px 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    font-size: 11px;
    color: #5a6a7e;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  /* ── Pick Button ── */
  .pick-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c3aed, #6366f1);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    box-shadow: 0 4px 18px rgba(99,102,241,0.4);
  }
  .pick-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(99,102,241,0.55);
  }
  .pick-btn:active { transform: translateY(0); }
  .pick-btn.active {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 4px 18px rgba(239,68,68,0.45);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 18px rgba(239,68,68,0.45); }
    50%      { box-shadow: 0 4px 28px rgba(239,68,68,0.7); }
  }

  /* ── Result Card ── */
  .result-card {
    margin-top: 18px;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    overflow: hidden;
    display: none;
  }
  .result-card.visible { display: block; }

  .swatch-row {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .swatch-row .color-name-badge {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .details {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #5a6a7e;
  }
  .detail-value {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    cursor: pointer;
    padding: 3px 10px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .detail-value:hover { background: rgba(255,255,255,0.07); }
  .detail-value.copied { color: #4ade80; }

  .closest-row {
    margin-top: 4px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .closest-swatch {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
  }
  .closest-text {
    font-size: 11px;
    color: #7a8fa6;
  }
  .closest-text strong {
    color: #cbd5e1;
    font-weight: 700;
  }

  /* ── History ── */
  .history-section { margin-top: 18px; }
  .history-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #5a6a7e;
    margin-bottom: 8px;
  }
  .history-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .history-chip {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
  }
  .history-chip:hover {
    transform: scale(1.15);
    border-color: rgba(255,255,255,0.4);
  }
  .history-chip .chip-tooltip {
    display: none;
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.12);
    color: #e2e8f0;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 10;
  }
  .history-chip:hover .chip-tooltip { display: block; }

  /* ── Hint ── */
  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 10.5px;
    color: #3d4f63;
    letter-spacing: 0.3px;
  }

  /* ── Copy toast ── */
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: #22c55e;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div class="header">
  <h1>ColorFind</h1>
  <p>Click anywhere on the page to pick a color</p>
</div>

<button class="pick-btn" id="pickBtn">⬛ Pick a Color</button>

<div class="result-card" id="resultCard">
  <div class="swatch-row" id="swatchRow">
    <div class="color-name-badge" id="colorName">—</div>
  </div>
  <div class="details">
    <div class="detail-row">
      <span class="detail-label">HEX</span>
      <span class="detail-value" id="hexVal" data-copy="">—</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">RGB</span>
      <span class="detail-value" id="rgbVal" data-copy="">—</span>
    </div>
    <div class="closest-row">
      <div class="closest-swatch" id="closestSwatch"></div>
      <div class="closest-text">Closest named color:<br><strong id="closestName">—</strong> <span id="closestHex" style="color:#5a6a7e">—</span></div>
    </div>
  </div>
</div>

<div class="history-section" id="historySection" style="display:none;">
  <div class="history-label">Recent colors</div>
  <div class="history-swatches" id="historySwatches"></div>
</div>

<div class="hint">A magnifier follows your cursor. Click or Enter to pick, arrow keys nudge 1px (Shift: 10px), Esc or right-click to exit.</div>

<div class="toast" id="toast">Copied!</div>

<script src="popup.js"></script>
</body>
</html>
